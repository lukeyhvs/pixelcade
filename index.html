<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixelCade - Mini Arcade Hub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="app-header">
    <h1>🎮 PixelCade</h1>
    <nav class="game-selector">
      <button class="game-btn active" data-game="snake">🐍 Snake</button>
      <button class="game-btn" data-game="flappy">🐤 Flappy Bird</button>
    </nav>
  </header>

  <main class="arcade-container">
    <div class="score-board">
      <div>Score: <span id="current-score">0</span></div>
      <div>High Score: <span id="high-score">0</span></div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="400" height="400"></canvas>
      <div id="game-over-overlay" class="overlay hidden">
        <h2 id="overlay-title">Game Over</h2>
        <p>Press <strong>Space</strong> or <strong>Tap Screen</strong> to Restart</p>
        <button id="restart-btn" class="btn">Play Again</button>
      </div>
    </div>

    <div class="controls-hint">
      <p id="hint-text">Use <strong>Arrow Keys</strong> or <strong>WASD</strong> to navigate.</p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
